<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <h1><span>⚓</span> Anchor</h1>
        <div class="stats">
            <div>⏱ <span id="latency">—</span></div>
            <div>🔧 <span id="modified">—</span></div>
            <div>🎯 <span id="confidence">—</span></div>
        </div>
    </div>

    <div id="chat-container" class="chat-container">
        <div class="message bot">
            <div class="final-text">
                Merhaba! Sorularınızı yanıtlayabilirim. Her cevap kurallarınıza göre otomatik düzeltilir.
            </div>
            <div class="meta-bar">
                <span class="latency-muted">⚓ Anchor Engine v3</span>
            </div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="message-input" placeholder="Sorunuzu yazın..." autocomplete="off">
        <button id="send-btn">Gönder</button>
    </div>

    <script src="/static/chat.js"></script>
</body>
</html>
