version: "3.8"

services:
  anchor:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ANCHOR_LLM_PROVIDER=openai
      - ANCHOR_LLM_API_KEY=${OPENAI_API_KEY}
      - ANCHOR_LLM_MODEL=gpt-4o
    volumes:
      - ./rules:/app/rules
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
