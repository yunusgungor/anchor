[project]
name = "anchor-engine"
version = "4.4.1"
description = "Deterministic LLM output rectification engine — model-agnostic, zero API cost, <10ms latency"
readme = "README.md"
authors = [{ name = "Yunus Güngör", email = "mail@yunusgungor.com" }]
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = [
    "llm", "rectification", "deterministic", "rules-engine",
    "ai-safety", "guardrails", "hallucination", "fact-checking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0",
    "anthropic>=0.30",
]
embed = [
    "sentence-transformers>=2.2",
]
ui = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
]
all = [
    "openai>=1.0",
    "sentence-transformers>=2.2",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "anthropic>=0.30",
]

[project.urls]
Homepage = "https://github.com/yunusgungor/anchor"
Repository = "https://github.com/yunusgungor/anchor"
Issues = "https://github.com/yunusgungor/anchor/issues"
Documentation = "https://github.com/yunusgungor/anchor#readme"

[project.scripts]
anchor = "anchor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["anchor*"]

[tool.setuptools.package-data]
anchor = ["py.typed"]
