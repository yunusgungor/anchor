[project]
name = "anchor-engine"
version = "3.0.0"
description = "Deterministic LLM output rectification engine — model-agnostic, zero API cost, <30ms latency"
readme = "README.md"
authors = [{ name = "Yunus Güngör", email = "mail@yunusgungor.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["llm", "rectification", "deterministic", "rules-engine", "ai-safety", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "sentence-transformers>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "memory-profiler>=0.60",
]
ui = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]
all = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.urls]
Homepage = "https://github.com/yunusgungor/anchor"
Repository = "https://github.com/yunusgungor/anchor"
Issues = "https://github.com/yunusgungor/anchor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
