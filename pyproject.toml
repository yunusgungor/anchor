[project]
name = "anchor"
version = "0.1.0"
description = "LLM çıktılarını deterministik kurallarla düzelten bağımsız araştırma projesi"
authors = [{ name = "Yunus Güngör" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "sentence-transformers>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "memory-profiler>=0.60",
]
ui = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
